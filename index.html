<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدوام</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #66727f;
    --line: #e3e8ed;
    --key: #f1f4f7;
    --key-active: #dfe5eb;
    --primary: #007bff;
    --primary-dark: #0062cc;
    --danger: #ef4444;
    --error-bg: #fdecec;
    --error-text: #b42318;
    --ok-bg: #e7f6ec;
    --ok-text: #18794e;
    --warn-bg: #fff6e0;
    --warn-text: #8a5a00;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100dvh;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "SF Arabic", "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; opacity: .6; }
  :focus-visible { outline: 3px solid rgba(0, 123, 255, .45); outline-offset: 2px; }

  .card {
    width: 100%;
    max-width: 420px;
    padding: 24px 20px;
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 6px 24px rgba(31, 41, 51, .08);
  }
  .card.wide { max-width: 640px; }
  h1 { margin: 0 0 20px; font-size: 1.3rem; line-height: 1.4; text-align: center; }
  h2 { margin: 24px 0 8px; font-size: 1.05rem; }

  label { display: block; margin-bottom: 4px; font-size: .92rem; font-weight: 600; }
  input {
    width: 100%;
    height: 48px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
  }
  .field { margin-bottom: 14px; }
  #username { direction: ltr; text-align: right; }
  #username:placeholder-shown { direction: rtl; }
  .pin-wrap { position: relative; }
  #pin { padding: 0 48px; direction: ltr; text-align: center; letter-spacing: .3em; }
  #eye {
    position: absolute;
    inset-block: 0;
    inset-inline-end: 0;
    width: 48px;
    display: grid;
    place-items: center;
    border: 0;
    background: none;
    color: var(--muted);
  }
  #eye[aria-pressed="false"] .eye-slash { display: none; }

  /* Tastenfelder bleiben auch in Arabisch links-nach-rechts angeordnet. */
  .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .numpad button {
    height: 52px;
    border: 0;
    border-radius: 12px;
    background: var(--key);
    font-size: 1.25rem;
    font-weight: 600;
  }
  .numpad button:active { background: var(--key-active); }

  .btn {
    display: block;
    width: 100%;
    min-height: 52px;
    padding: 8px 14px;
    border: 0;
    border-radius: 12px;
    font-weight: 700;
    line-height: 1.35;
  }
  .btn small { display: block; font-size: .8rem; font-weight: 500; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:active { background: var(--primary-dark); }
  .btn-outline { background: #fff; color: var(--primary-dark); box-shadow: inset 0 0 0 2px var(--primary); }
  .btn-danger { margin-top: 24px; background: var(--danger); color: #fff; }
  .stack { display: grid; gap: 10px; }
  .footer { margin: 16px 0 0; color: var(--muted); font-size: .78rem; text-align: center; }

  .msg { margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; font-size: .92rem; }
  .msg:empty { display: none; }
  .msg.error { background: var(--error-bg); color: var(--error-text); }
  .msg.ok { background: var(--ok-bg); color: var(--ok-text); }
  .msg.warn { background: var(--warn-bg); color: var(--warn-text); }
  #stamp-msg { margin: 12px 0 0; }

  .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 20px; }
  .month-nav button {
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 12px;
    background: var(--key);
    font-size: 1.1rem;
  }
  #month-label { font-weight: 700; text-align: center; }

  .stats { margin: 12px 0 0; padding: 4px 14px; border-radius: 12px; background: var(--bg); }
  .stats div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .stats div:first-child { border-top: 0; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats .due dd { color: var(--primary-dark); font-size: 1.1rem; }
  .stats + .msg { margin-top: 10px; }

  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th { padding: 8px 4px; color: var(--muted); font-size: .82rem; font-weight: 600; text-align: start; }
  td { padding: 10px 4px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th:not(:first-child), td:not(:first-child) { width: 64px; }
  .empty { margin: 12px 0 0; color: var(--muted); text-align: center; }
  #status { margin: 16px 0 0; color: var(--muted); text-align: center; }
  #retry { margin-top: 8px; }

  details { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; }
  summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary b { overflow-wrap: anywhere; }
  summary .amount { flex: none; color: var(--primary-dark); font-weight: 700; }
  .detail-body { padding: 0 14px 14px; }
  .salary-form { display: flex; align-items: flex-end; gap: 8px; margin-top: 14px; }
  .salary-form > div { flex: 1; min-width: 0; }
  .salary-form input { direction: ltr; text-align: right; }
  .salary-form .btn { width: auto; min-height: 48px; }
  .salary-msg { margin: 10px 0 0; }

  .admin-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: end; }
  .admin-form label { margin: 0; font-size: .85rem; }
  .admin-form input, .admin-form select { height: 44px; }
  .admin-form input[type="date"], .admin-form input[type="time"], .admin-form .ltr { direction: ltr; text-align: right; }
  .admin-form .btn { min-height: 44px; }
  .admin-form .full { grid-column: 1 / -1; }
  select { width: 100%; padding: 0 10px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font: inherit; color: inherit; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .check input { width: 20px; height: 20px; flex: none; }
  .badge { margin-inline-start: 8px; padding: 1px 8px; border-radius: 999px; background: var(--error-bg); color: var(--error-text); font-size: .75rem; font-weight: 600; }
  .mini { min-width: 34px; height: 34px; padding: 0 6px; border: 0; border-radius: 8px; background: var(--key); font-size: .85rem; }
  .mini.armed { background: var(--danger); color: #fff; }
  .actions { display: flex; gap: 4px; justify-content: flex-end; }
  td.actions-cell, th.actions-cell { width: 76px; }
  .absence { color: var(--muted); font-weight: 600; }
  .admin-tools { margin-top: 12px; }

  .brand { margin: 0 0 6px; color: var(--primary-dark); font-size: 1.05rem; font-weight: 800; text-align: center; }
  .welcome { margin: -12px 0 10px; color: var(--muted); text-align: center; }
  .wisdom { margin: 0 0 18px; padding: 10px 12px; border-radius: 10px; background: var(--bg); font-size: .92rem; text-align: center; }
  .progress { height: 10px; margin-top: 10px; overflow: hidden; border-radius: 999px; background: var(--line); }
  .progress div { height: 100%; background: var(--primary); }
  textarea { display: block; width: 100%; min-height: 96px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font: inherit; color: inherit; resize: vertical; }
  .hint { margin: 4px 0 10px; color: var(--muted); font-size: .82rem; }
  .checklist { display: grid; gap: 6px; margin: 10px 0; padding: 0; list-style: none; }
  .checklist li { display: flex; align-items: center; gap: 8px; }
  .checklist input[type="checkbox"] { flex: none; width: 20px; height: 20px; }
  .checklist span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .checklist .done { color: var(--muted); text-decoration: line-through; }
  .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .add-row input { flex: 1; min-width: 0; height: 44px; }
  .add-row .btn { width: auto; min-height: 44px; }
  .note-view { padding: 10px 0; border-top: 1px solid var(--line); }
  .note-view b { display: block; font-size: .85rem; color: var(--muted); }
  .note-view p { margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .login-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: .9rem; }
  .login-row a { color: var(--primary-dark); font-weight: 600; }
</style>
</head>
<body>

<main class="card" id="login-view">
  <p class="brand" id="company-login"></p>
  <h1>تسجيل الدوام - تسجيل الدخول</h1>
  <form id="login-form" novalidate>
    <p class="msg error" id="login-msg" role="alert"></p>
    <div class="field">
      <label for="username">اسم المستخدم</label>
      <input id="username" type="text" placeholder="مثال: ahmed" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="pin">الرمز السري (6 أرقام)</label>
      <div class="pin-wrap">
        <!-- inputmode="none": Lässt die Handy-Tastatur zu, damit nur der Ziffernblock sichtbar ist. -->
        <input id="pin" type="password" maxlength="6" inputmode="none" autocomplete="new-password">
        <button id="eye" type="button" aria-pressed="false" aria-label="إظهار الرمز السري">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
            <path class="eye-slash" d="M4 4l16 16"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="numpad" id="numpad" dir="ltr">
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <span></span>
      <button type="button" data-key="0">0</button>
      <button type="button" data-key="del" aria-label="حذف">⌫</button>
    </div>
    <button class="btn btn-primary" id="login-btn" type="submit">تسجيل الدخول</button>
  </form>
  <p class="footer">عند تسجيل الدخول يطلب التطبيق موقعك، ويراه المدير.</p>
  <p class="footer">مدعوم بحماية Supabase</p>
</main>

<main class="card" id="app-view" hidden>
  <p class="brand" id="company-app"></p>
  <h1 id="greeting"></h1>
  <p class="welcome" id="welcome-line"></p>
  <p class="wisdom" id="wisdom"></p>

  <section id="stamp" hidden>
    <div class="stack">
      <button class="btn btn-primary" id="clock-in" type="button">حضور<small>تسجيل وقت البدء</small></button>
      <button class="btn btn-outline" id="clock-out" type="button">انصراف<small>تسجيل وقت الانتهاء لهذا اليوم</small></button>
    </div>
    <p class="msg" id="stamp-msg" role="status"></p>
  </section>

  <div class="month-nav">
    <button id="prev-month" type="button" aria-label="الشهر السابق">→</button>
    <span id="month-label" aria-live="polite"></span>
    <button id="next-month" type="button" aria-label="الشهر التالي">←</button>
  </div>

  <p id="status" role="status" hidden></p>
  <button class="btn btn-outline" id="retry" type="button" hidden>إعادة المحاولة</button>
  <div id="content"></div>

  <button class="btn btn-danger" id="logout" type="button">تسجيل الخروج</button>
</main>

    const node = Object.assign(document.createElement(tag), props);
    node.append(...kids);
    return node;
  };

  let db = null;
  let currentUserId = null;
  let currentEmail = null;
  let noteDraft = null; // Ungespeicherte Notiz übersteht das Neuladen nach dem Stempeln.
  let month = null;
  let loadSeq = 0; // Verwirft Antworten, die erst nach Abmelden oder Monatswechsel eintreffen.
  let loggingOut = null;
  const openCards = new Set(); // Aufgeklappte Mitarbeiter bleiben nach dem Neuladen offen.
  const notices = new Map(); // Meldungen, die das Neuladen nach einer Admin-Aktion überstehen.

  // ---------- Datum und Gehalt ----------
  const berlinNow = (options) =>
    new Intl.DateTimeFormat("en-CA", { timeZone: TIME_ZONE, ...options }).format(new Date());
  const currentMonth = () => berlinNow({ year: "numeric", month: "2-digit" });
  const today = () => berlinNow({ year: "numeric", month: "2-digit", day: "2-digit" });

  function shiftMonth(value, delta) {
    const [year, mon] = value.split("-").map(Number);
    return new Date(Date.UTC(year, mon - 1 + delta, 1)).toISOString().slice(0, 7);
  }

  function targetMinutes(value) {
    const [year, mon] = value.split("-").map(Number);
    const days = new Date(Date.UTC(year, mon, 0)).getUTCDate();
    let workdays = 0;
    for (let day = 1; day <= days; day++) {
      if (new Date(Date.UTC(year, mon - 1, day)).getUTCDay() !== DAY_OFF) workdays++;
    }
    return workdays * WORKDAY_MINUTES;
  }

  function toMinutes(time) {
    const [h, m, s] = time.split(":").map(Number);
    return h * 60 + m + (s || 0) / 60;
  }

  function workedMinutes(entry) {
    if (!entry.ende_zeit) return 0;
    return Math.max(0, toMinutes(entry.ende_zeit) - toMinutes(entry.start_zeit));
  }

  const isDayOff = (date) => new Date(date + "T00:00:00Z").getUTCDay() === DAY_OFF;

  // Stundensatz = Gehalt ÷ Soll-Stunden. Jede Stunde über 8 am Tag und jede Stunde am freien
  // Wochentag ist Überstunde zu 150 %. Damit können reguläre Stunden das Monatssoll nie übersteigen.
  // Bezahlte Abwesenheit zählt als voller Arbeitstag, außer am freien Wochentag.
  function payroll(entries, absences, salary, value) {
    const paidDays = new Set(absences.map((absence) => absence.datum).filter((date) => !isDayOff(date)));
    const minutesByDay = new Map(entries.map((entry) => [entry.datum, workedMinutes(entry)]));
    paidDays.forEach((date) => { if (!minutesByDay.has(date)) minutesByDay.set(date, 0); });

    let regular = 0;
    let overtime = 0;
    minutesByDay.forEach((minutes, date) => {
      if (isDayOff(date)) {
        overtime += minutes;
        return;
      }
      regular += paidDays.has(date) ? WORKDAY_MINUTES : Math.min(minutes, WORKDAY_MINUTES);
      overtime += Math.max(0, minutes - WORKDAY_MINUTES);
    });

    const target = targetMinutes(value);
    const round = (amount) => Math.round(amount * 100) / 100;
    const rate = salary == null ? null : salary / target;
    return {
      worked: regular + overtime,
      regular,
      overtime,
      target,
      percent: Math.round((regular / target) * 100),
      overtimePay: rate == null ? null : round(rate * OVERTIME_FACTOR * overtime),
      due: rate == null ? null : round(rate * regular + rate * OVERTIME_FACTOR * overtime)
    };
  }

  // Wählt pro Kalendertag immer denselben Eintrag aus einer Liste.
  function dailyIndex(date, length) {
    return Math.floor(Date.parse(date + "T00:00:00Z") / 86400000) % length;
  }

  const formatMoney = (amount) =>
    // Festes Zeichen, weil der arabische Standard "US$" statt "$" anzeigt.
    CURRENCY_SIGN + new Intl.NumberFormat(LOCALE, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
  const formatHours = (minutes) =>
    (minutes / 60).toLocaleString(LOCALE, { maximumFractionDigits: 2 });
  const formatDate = (date) =>
    new Date(date + "T00:00:00Z").toLocaleDateString(LOCALE, {
      weekday: "long", day: "numeric", month: "long", timeZone: "UTC"
    });
  const formatDateShort = (date) =>
    new Date(date + "T00:00:00Z").toLocaleDateString(LOCALE, {
      weekday: "short", day: "numeric", timeZone: "UTC"
    });
  const formatMonth = (value) =>
    new Date(value + "-01T00:00:00Z").toLocaleDateString(LOCALE, {
      month: "long", year: "numeric", timeZone: "UTC"
    });
  const formatTime = (time) => (time ? time.slice(0, 5) : "—");

  // ---------- Fehlertexte ----------
  const isNetworkError = (error) =>
    error?.name === "AuthRetryableFetchError" ||
    /fetch|network|load failed/i.test(error?.message || "");

  function authErrorText(error) {
    if (isNetworkError(error)) return TEXT.network;
    if (error.status === 429) return TEXT.tooMany;
    if (error.status === 400) return TEXT.badLogin;
    return TEXT.unexpected;
  }
  const dataErrorText = (error) => (isNetworkError(error) ? TEXT.network : TEXT.unexpected);

  function setMessage(node, text, kind) {
    node.textContent = text;
    node.classList.remove("error", "ok", "warn");
    if (kind) node.classList.add(kind);
  }

  // ---------- Login ----------
  function normalizePin(value) {
    return value
      .replace(/[٠-٩]/g, (digit) => String(digit.charCodeAt(0) - 0x660))
      .replace(/\D/g, "")
      .slice(0, 6);
  }

  function setPinVisible(visible) {
    $("pin").type = visible ? "text" : "password";
    $("eye").setAttribute("aria-pressed", String(visible));
    $("eye").setAttribute("aria-label", visible ? TEXT.hidePin : TEXT.showPin);
  }

  // Blockiert die Anmeldung nie: Ablehnung oder fehlendes GPS wird nur vermerkt.
  function recordLoginLocation(userId) {
    const save = (row) => db.from("anmeldungen").insert({ user_id: userId, ...row }).then(() => {}, () => {});
    if (!navigator.geolocation) return save({ status: "nicht_verfuegbar" });
    navigator.geolocation.getCurrentPosition(
      ({ coords }) => save({
        status: "ok",
        breite: coords.latitude,
        laenge: coords.longitude,
        genauigkeit: Math.round(coords.accuracy)
      }),
      (error) => save({ status: error.code === error.PERMISSION_DENIED ? "abgelehnt" : "nicht_verfuegbar" }),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
  }

  async function handleLogin(event) {
    event.preventDefault();
    const message = $("login-msg");
    const username = $("username").value.trim().toLowerCase();
    const pin = $("pin").value;
    setMessage(message, "", "error");

    if (!window.supabase) return setMessage(message, TEXT.library, "error");
    if (!db) return setMessage(message, TEXT.config, "error");
    if (!username) return setMessage(message, TEXT.usernameEmpty, "error");
    if (!/^[a-z0-9._-]+$/.test(username)) return setMessage(message, TEXT.usernameLatin, "error");
    if (pin.length !== 6) return setMessage(message, TEXT.pinLength, "error");

    const button = $("login-btn");
    button.disabled = true;
    button.textContent = TEXT.signingIn;
    try {
      await loggingOut;
      const { data, error } = await db.auth.signInWithPassword({
        email: `${username}@${EMAIL_DOMAIN}`,
        password: pin
      });
      if (error) {
        $("pin").value = "";
        setMessage(message, authErrorText(error), "error");
      } else {
        recordLoginLocation(data.user.id);
      }
    } catch (error) {
      $("pin").value = "";
      setMessage(message, authErrorText(error), "error");
    } finally {
      button.disabled = false;
      button.textContent = TEXT.signIn;
    }
  }

  // ---------- Daten laden ----------
  async function fetchMonth(table, columns, value) {
    const from = `${value}-01`;
    const to = `${shiftMonth(value, 1)}-01`;
    const pageSize = 1000; // Die API liefert höchstens 1000 Zeilen pro Abfrage.
    const rows = [];
    for (let page = 0; ; page++) {
      const { data, error } = await db
        .from(table)
        .select(columns)
        .gte("datum", from)
        .lt("datum", to)
        .order("datum", { ascending: false })
        .order("id")
        .range(page * pageSize, page * pageSize + pageSize - 1);
      if (error) throw error;
      rows.push(...data);
      if (data.length < pageSize) return rows;
    }
  }

  async function loadMonth() {
    const seq = ++loadSeq;
    const value = month;
    const status = $("status");
    status.textContent = TEXT.loading;
    status.hidden = false;
    $("retry").hidden = true;
    $("prev-month").disabled = $("next-month").disabled = true;

    try {
      const [{ data: staff, error }, entries, absences, notes, logins] = await Promise.all([
        // RLS liefert normalen Nutzern nur die eigene Zeile, Admins alle.
        db.from("mitarbeiter").select("user_id, benutzername, monatsgehalt, ist_admin, aktiv").order("benutzername"),
        fetchMonth("zeiten", "id, user_id, datum, start_zeit, ende_zeit", value),
        fetchMonth("abwesenheiten", "id, user_id, datum, art", value),
        // Notizen und Anmeldeorte sind Zusatzfunktionen: Ein Fehler dort darf das Stempeln nicht blockieren.
        fetchMonth("notizen", "id, user_id, datum, inhalt, aufgaben", value).catch(() => null),
        // RLS liefert Anmeldeorte nur an Admins, alle anderen bekommen eine leere Liste.
        fetchMonth("anmeldungen", "id, user_id, datum, zeit, status, breite, laenge, genauigkeit", value).catch(() => [])
      ]);
      if (error) throw error;
      if (seq !== loadSeq) return;

      const me = staff.find((row) => row.user_id === currentUserId);
      status.hidden = true;
      $("month-label").textContent = formatMonth(value);
      if (me?.ist_admin) {
        renderAdmin(staff.filter((row) => !row.ist_admin), entries, absences, notes || [], logins, value);
      } else {
        renderEmployee(me, entries, absences, notes, value);
      }
    } catch (error) {
      if (seq !== loadSeq) return;
      $("content").replaceChildren();
      status.textContent = dataErrorText(error);
      status.hidden = false;
      $("retry").hidden = false;
    } finally {
      if (seq === loadSeq) {
        $("prev-month").disabled = false;
        $("next-month").disabled = month >= currentMonth();
      }
    }
  }

  // ---------- Darstellung ----------
  // Mitarbeiter sehen ihren Fortschritt in Prozent, die Soll-Stunden sieht nur der Admin.
  function statsBlock(pay, salary, value, admin) {
    const row = (label, text, className = "") =>
      el("div", { className }, el("dt", { textContent: label }), el("dd", { textContent: text }));
    const dueLabel = value === currentMonth() ? TEXT.dueSoFar : TEXT.due;
    const rows = [
      row(TEXT.monthlySalary, salary == null ? TEXT.noSalary : formatMoney(salary)),
      admin
        ? row(TEXT.hours, formatHours(pay.regular) + TEXT.hoursOf + formatHours(pay.target) + TEXT.hoursUnit)
        : row(TEXT.progress, `${pay.percent}%`),
      row(TEXT.overtimeHours, formatHours(pay.overtime))
    ];
    if (admin) rows.push(row(TEXT.overtimePay, pay.overtimePay == null ? "—" : formatMoney(pay.overtimePay)));
    rows.push(row(dueLabel, pay.due == null ? "—" : formatMoney(pay.due), "due"));
    return el("dl", { className: "stats" }, ...rows);
  }

  function progressBar(percent) {
    const bar = el("div");
    bar.style.width = `${Math.min(100, percent)}%`;
    return el("div", { className: "progress" }, bar);
  }

  function missingEndNote(entries) {
    const count = entries.filter((entry) => !entry.ende_zeit && entry.datum !== today()).length;
    return count ? el("p", { className: "msg warn", textContent: TEXT.missingEnd + count }) : "";
  }

  function entriesTable(entries, absences, admin) {
    const rows = [
      ...entries.map((entry) => ({ date: entry.datum, entry })),
      ...absences.map((absence) => ({ date: absence.datum, absence }))
    ].sort((a, b) => b.date.localeCompare(a.date));
    if (!rows.length) return el("p", { className: "empty", textContent: TEXT.noEntries });

    const headings = [TEXT.date, TEXT.start, TEXT.end].map((text) => el("th", { scope: "col", textContent: text }));
    if (admin) headings.push(el("th", { className: "actions-cell" }));
    const body = rows.map(({ date, entry, absence }) => {
      const cells = [el("td", { textContent: admin ? formatDateShort(date) : formatDate(date) })];
      if (entry) {
        cells.push(
          el("td", {}, el("bdi", { textContent: formatTime(entry.start_zeit) })),
          el("td", {}, el("bdi", { textContent: formatTime(entry.ende_zeit) })));
      } else {
        cells.push(el("td", { colSpan: 2, className: "absence", textContent: TEXT.absenceTypes[absence.art] }));
      }
      if (admin) {
        cells.push(el("td", { className: "actions-cell" }, el("div", { className: "actions" },
          ...(entry ? [editButton(() => admin.edit(entry))] : []),
          removeButton((button) => admin.remove(button, entry, absence)))));
      }
      return el("tr", {}, ...cells);
    });
    return el("table", {}, el("thead", {}, el("tr", {}, ...headings)), el("tbody", {}, ...body));
  }

  function renderEmployee(me, entries, absences, notes, value) {
    const salary = me?.monatsgehalt ?? null;
    const pay = payroll(entries, absences, salary, value);
    $("stamp").hidden = false;
    $("app-view").classList.remove("wide");
    const earlier = (notes || []).filter((note) => note.datum !== today());
    $("content").replaceChildren(
      statsBlock(pay, salary, value, false),
      progressBar(pay.percent),
      missingEndNote(entries),
      // Ohne geladene Notizen kein Editor, sonst würde Speichern die vorhandene Notiz leer überschreiben.
      ...(notes && value === currentMonth() ? [noteEditor(notes)] : []),
      el("h2", { textContent: TEXT.entries }),
      entriesTable(entries, absences),
      ...(earlier.length ? [el("h2", { textContent: TEXT.notesPrevious }), ...earlier.map(noteView)] : []));
  }

  // ---------- Notizen ----------
  // Die Datenbank prüft die Einträge. Der Filter schützt die Ansicht zusätzlich vor fehlerhaften Zeilen.
  const validTasks = (tasks) =>
    (Array.isArray(tasks) ? tasks : []).filter((task) => typeof task?.text === "string");

  function noteEditor(notes) {
    const saved = notes.find((note) => note.datum === today());
    const draft = noteDraft || { inhalt: saved?.inhalt ?? "", aufgaben: validTasks(saved?.aufgaben) };
    const touch = () => { noteDraft = draft; };

    const line = noticeLine("note");
    const text = el("textarea", { maxLength: 5000, value: draft.inhalt });
    text.setAttribute("aria-label", TEXT.notesToday);
    text.addEventListener("input", () => { draft.inhalt = text.value; touch(); });

    const list = el("ul", { className: "checklist" });
    function renderTasks() {
      list.replaceChildren(...draft.aufgaben.map((task, index) => {
        const box = el("input", { type: "checkbox", checked: Boolean(task.erledigt) });
        const label = el("span", { textContent: task.text, className: task.erledigt ? "done" : "" });
        box.setAttribute("aria-label", task.text);
        box.addEventListener("change", () => {
          task.erledigt = box.checked;
          touch();
          renderTasks();
        });
        const remove = el("button", { className: "mini", type: "button", textContent: "✕" });
        remove.setAttribute("aria-label", TEXT.remove);
        remove.addEventListener("click", () => {
          draft.aufgaben.splice(index, 1);
          touch();
          renderTasks();
        });
        return el("li", {}, box, label, remove);
      }));
    }
    renderTasks();

    const newTask = el("input", { type: "text", maxLength: 200, placeholder: TEXT.taskPlaceholder });
    const addTask = el("button", { className: "btn btn-outline", type: "button", textContent: TEXT.add });
    const addCurrent = () => {
      const value = newTask.value.trim();
      if (!value || draft.aufgaben.length >= 100) return;
      draft.aufgaben.push({ text: value, erledigt: false });
      newTask.value = "";
      touch();
      renderTasks();
      newTask.focus();
    };
    addTask.addEventListener("click", addCurrent);
    newTask.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      addCurrent();
    });

    const save = el("button", { className: "btn btn-primary", type: "button", textContent: TEXT.save });
    save.addEventListener("click", () => adminAction("note", line, save, async () => {
      const { error } = await db.from("notizen").upsert(
        { user_id: currentUserId, datum: today(), inhalt: draft.inhalt, aufgaben: draft.aufgaben },
        { onConflict: "user_id,datum" });
      if (error) return dataErrorText(error);
      noteDraft = null;
      return null;
    }, TEXT.notesSaved));

    return el("section", {},
      el("h2", { textContent: TEXT.notesToday }),
      el("p", { className: "hint", textContent: TEXT.notesHint }),
      text,
      list,
      el("div", { className: "add-row" }, newTask, addTask),
      save,
      line);
  }

  function noteView(note) {
    const tasks = validTasks(note.aufgaben);
    return el("div", { className: "note-view" },
      el("b", { textContent: formatDate(note.datum) }),
      ...(note.inhalt ? [el("p", { textContent: note.inhalt })] : []),
      ...(tasks.length ? [el("ul", { className: "checklist" }, ...tasks.map((task) => el("li", {},
        el("span", { textContent: `${task.erledigt ? "✓" : "○"} ${task.text}`, className: task.erledigt ? "done" : "" }))))] : []));
  }

  // ---------- Admin ----------
  function editButton(onClick) {
    const button = el("button", { className: "mini", type: "button", textContent: "✎" });
    button.setAttribute("aria-label", TEXT.edit);
    button.addEventListener("click", onClick);
    return button;
  }

  // Erster Klick fragt nach, zweiter löscht. Browser-Dialoge sind in dieser App tabu.
  function removeButton(onConfirm) {
    const button = el("button", { className: "mini", type: "button", textContent: "✕" });
    button.setAttribute("aria-label", TEXT.remove);
    button.addEventListener("click", () => {
      if (button.classList.contains("armed")) return onConfirm(button);
      button.classList.add("armed");
      button.textContent = TEXT.confirmRemove;
    });
    button.addEventListener("blur", () => {
      button.classList.remove("armed");
      button.textContent = "✕";
    });
    return button;
  }

  const field = (text, input, className = "") => el("label", { className }, text, input);

  function collapsible(key, summary, ...body) {
    const details = el("details", { open: openCards.has(key) },
      el("summary", {}, ...summary),
      el("div", { className: "detail-body" }, ...body));
    details.addEventListener("toggle", () => {
      if (details.open) openCards.add(key); else openCards.delete(key);
    });
    return details;
  }

  function noticeLine(key) {
    const line = el("p", { className: "msg salary-msg", role: "status" });
    const notice = notices.get(key);
    if (notice) {
      setMessage(line, notice.text, notice.kind);
      notices.delete(key);
    }
    return line;
  }

  // Die Aktion liefert einen Fehlertext oder null. Nach Erfolg wird der Monat neu geladen.
  async function adminAction(key, line, button, action, successText) {
    const seq = loadSeq;
    button.disabled = true;
    setMessage(line, "");
    let errorText;
    try {
      errorText = await action();
    } catch (error) {
      errorText = dataErrorText(error);
    }
    if (seq !== loadSeq) return;
    button.disabled = false;
    if (errorText) return setMessage(line, errorText, "error");
    notices.set(key, { text: successText, kind: "ok" });
    loadMonth();
  }

  const saveErrorText = (error) => {
    if (error.code === "23505") return TEXT.dayTaken;
    if (error.code === "22023") return TEXT.endBeforeStart;
    return dataErrorText(error);
  };

  async function callStaffFunction(body) {
    const { error } = await db.functions.invoke("admin-mitarbeiter", { body });
    if (!error) return null;
    if (error.name === "FunctionsFetchError") return TEXT.network;
    const code = await error.context?.json().then((reply) => reply.error, () => null);
    return code === "username_taken" ? TEXT.usernameTaken : TEXT.unexpected;
  }

  function validateNewPin(input, line) {
    const pin = normalizePin(input.value);
    if (pin.length === 6) return pin;
    setMessage(line, TEXT.pinLength, "error");
    return null;
  }

  function pinInput() {
    const input = el("input", { type: "text", inputMode: "numeric", maxLength: 6, autocomplete: "off", className: "ltr" });
    input.addEventListener("input", () => { input.value = normalizePin(input.value); });
    return input;
  }

  function addStaffCard() {
    const line = noticeLine("new-staff");
    const username = el("input", {
      type: "text", className: "ltr", autocomplete: "off", autocapitalize: "none", spellcheck: false
    });
    const pin = pinInput();
    const submit = el("button", { className: "btn btn-primary full", type: "submit", textContent: TEXT.add });
    const form = el("form", { className: "admin-form", noValidate: true },
      field(TEXT.usernameLabel, username),
      field(TEXT.newPinLabel, pin),
      submit);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = username.value.trim().toLowerCase();
      if (!name) return setMessage(line, TEXT.usernameEmpty, "error");
      if (!/^[a-z0-9._-]+$/.test(name)) return setMessage(line, TEXT.usernameLatin, "error");
      const value = validateNewPin(pin, line);
      if (!value) return;
      adminAction("new-staff", line, submit,
        () => callStaffFunction({ action: "anlegen", benutzername: name, pin: value }),
        TEXT.staffCreated);
    });
    return collapsible("new-staff", [el("b", { textContent: TEXT.addStaff })], form, line);
  }

  function ownPinCard() {
    const line = noticeLine("own-pin");
    const current = pinInput();
    const fresh = pinInput();
    current.type = fresh.type = "password";
    const submit = el("button", { className: "btn btn-primary full", type: "submit", textContent: TEXT.save });
    const form = el("form", { className: "admin-form", noValidate: true },
      field(TEXT.currentPin, current),
      field(TEXT.newPinLabel, fresh),
      submit);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const oldPin = validateNewPin(current, line);
      const newPin = oldPin && validateNewPin(fresh, line);
      if (!newPin) return;
      adminAction("own-pin", line, submit, async () => {
        // Die aktuelle PIN wird geprüft, damit ein offen gelassenes Gerät nicht reicht.
        const check = await db.auth.signInWithPassword({ email: currentEmail, password: oldPin });
        if (check.error) return check.error.status === 400 ? TEXT.wrongCurrentPin : authErrorText(check.error);
        const { error } = await db.auth.updateUser({ password: newPin });
        if (!error) return null;
        return error.code === "same_password" ? TEXT.samePin : dataErrorText(error);
      }, TEXT.ownPinChanged);
    });
    return collapsible("own-pin", [el("b", { textContent: TEXT.ownPin })], form, line);
  }

  function exportCsv(staff, entries, absences, value) {
    // Semikolon und Dezimalkomma, damit deutsches Excel die Spalten direkt trennt.
    const number = (amount) => (amount == null ? "" : Number(amount).toFixed(2).replace(".", ","));
    const text = (cell) => (/^[=+\-@]/.test(cell) ? `'${cell}` : cell); // Keine Formeln in Excel.
    const lines = staff.map((person) => {
      const own = (row) => row.user_id === person.user_id;
      const pay = payroll(entries.filter(own), absences.filter(own), person.monatsgehalt, value);
      // Wie beim Gehalt zählt Abwesenheit am freien Wochentag nicht mit.
      const paidAbsences = absences.filter((row) => own(row) && !isDayOff(row.datum));
      const datesOf = (art) => paidAbsences.filter((row) => row.art === art).map((row) => row.datum).sort();
      const arts = Object.keys(TEXT.absenceTypes);
      const reasons = arts
        .filter((art) => datesOf(art).length)
        .map((art) => `${TEXT.absenceTypes[art]}: ${datesOf(art).join("، ")}`)
        .join(" | ");
      return [text(person.benutzername), person.aktiv ? TEXT.active : TEXT.inactive,
        number(pay.worked / 60), number(pay.target / 60), number(pay.overtime / 60), number(pay.overtimePay),
        number(person.monatsgehalt), number(pay.due),
        ...arts.map((art) => datesOf(art).length), reasons].join(";");
    });
    const csv = "﻿" + [TEXT.csvHeaders.join(";"), ...lines].join("\r\n");
    const link = el("a", {
      href: URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })),
      download: `zeiterfassung-${value}.csv`
    });
    link.click();
    URL.revokeObjectURL(link.href);
  }

  function renderAdmin(staff, entries, absences, notes, logins, value) {
    $("stamp").hidden = true;
    $("app-view").classList.add("wide");
    const own = (rows, person) => rows.filter((row) => row.user_id === person.user_id);
    const cards = staff.map((person) =>
      staffCard(person, own(entries, person), own(absences, person), value, staff, own(notes, person), own(logins, person)));
    const exportButton = el("button", { className: "btn btn-outline admin-tools", type: "button", textContent: TEXT.export });
    exportButton.addEventListener("click", () => exportCsv(staff, entries, absences, value));
    $("content").replaceChildren(
      el("div", { className: "admin-tools" }, addStaffCard(), ownPinCard()),
      exportButton,
      el("h2", { textContent: TEXT.staff }),
      ...(cards.length ? cards : [el("p", { className: "empty", textContent: TEXT.noStaff })]));
  }

  function loginRow(login) {
    const time = new Date(login.zeit).toLocaleString(LOCALE, {
      timeZone: TIME_ZONE, day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    });
    let place;
    if (login.status === "ok") {
      place = el("a", {
        href: `https://www.google.com/maps?q=${Number(login.breite)},${Number(login.laenge)}`,
        target: "_blank",
        rel: "noopener noreferrer",
        textContent: `${TEXT.openMap} (${TEXT.accuracy}${login.genauigkeit ?? "?"}${TEXT.meters})`
      });
    } else {
      place = el("span", { textContent: login.status === "abgelehnt" ? TEXT.locationRefused : TEXT.locationUnavailable });
    }
    return el("div", { className: "login-row" }, el("span", { textContent: time }), place);
  }

  function staffCard(person, entries, absences, value, staff, notes, logins) {
    const key = person.user_id;
    const pay = payroll(entries, absences, person.monatsgehalt, value);
    const line = noticeLine(key);

    // Zeiten: dasselbe Formular zum Hinzufügen und Bearbeiten.
    let editingId = null;
    const entryTitle = el("h2", { textContent: TEXT.addEntry });
    const dateInput = el("input", { type: "date" });
    const startInput = el("input", { type: "time" });
    const endInput = el("input", { type: "time" });
    const entrySave = el("button", { className: "btn btn-primary", type: "submit", textContent: TEXT.save });
    const entryCancel = el("button", { className: "btn btn-outline", type: "button", textContent: TEXT.cancel, hidden: true });
    const entryForm = el("form", { className: "admin-form", noValidate: true },
      field(TEXT.date, dateInput, "full"),
      field(TEXT.start, startInput),
      field(TEXT.end, endInput),
      entrySave,
      entryCancel);

    function setEditing(entry) {
      editingId = entry ? entry.id : null;
      dateInput.value = entry ? entry.datum : "";
      startInput.value = entry ? entry.start_zeit.slice(0, 5) : "";
      endInput.value = entry?.ende_zeit ? entry.ende_zeit.slice(0, 5) : "";
      entryTitle.textContent = entry ? TEXT.editEntry : TEXT.addEntry;
      entryCancel.hidden = !entry;
      if (entry) entryForm.scrollIntoView({ block: "nearest" });
    }
    entryCancel.addEventListener("click", () => setEditing(null));
    entryForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!dateInput.value || !startInput.value) return setMessage(line, TEXT.fillFields, "error");
      adminAction(key, line, entrySave, async () => {
        const { error } = await db.rpc("admin_zeit_speichern", {
          p_id: editingId,
          p_user_id: person.user_id,
          p_datum: dateInput.value,
          p_start: startInput.value,
          p_ende: endInput.value || null
        });
        return error ? saveErrorText(error) : null;
      }, TEXT.savedOk);
    });

    const table = entriesTable(entries, absences, {
      edit: setEditing,
      remove: (button, entry, absence) => adminAction(key, line, button, async () => {
        const { error } = entry
          ? await db.rpc("admin_zeit_loeschen", { p_id: entry.id })
          : await db.from("abwesenheiten").delete().eq("id", absence.id);
        return error ? dataErrorText(error) : null;
      }, TEXT.removedOk)
    });

    // Bezahlte Abwesenheit
    const absenceDate = el("input", { type: "date" });
    const absenceType = el("select", {},
      ...Object.entries(TEXT.absenceTypes).map(([art, label]) => el("option", { value: art, textContent: label })));
    const absenceAll = el("input", { type: "checkbox" });
    const absenceSave = el("button", { className: "btn btn-primary full", type: "submit", textContent: TEXT.add });
    const absenceForm = el("form", { className: "admin-form", noValidate: true },
      field(TEXT.date, absenceDate),
      field(TEXT.absenceType, absenceType),
      field(TEXT.allStaff, absenceAll, "check full"),
      absenceSave);
    absenceForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!absenceDate.value) return setMessage(line, TEXT.fillFields, "error");
      const targets = absenceAll.checked ? staff.filter((row) => row.aktiv) : [person];
      const rows = targets.map((row) => ({ user_id: row.user_id, datum: absenceDate.value, art: absenceType.value }));
      adminAction(key, line, absenceSave, async () => {
        // Vorhandene Einträge bleiben stehen, etwa Urlaub an einem später eingetragenen Feiertag.
        const { error } = await db.from("abwesenheiten")
          .upsert(rows, { onConflict: "user_id,datum", ignoreDuplicates: true });
        return error ? dataErrorText(error) : null;
      }, TEXT.savedOk);
    });

    // Gehalt
    const salaryInput = el("input", {
      type: "number", min: "0", step: "0.01", inputMode: "decimal", className: "ltr",
      value: person.monatsgehalt ?? ""
    });
    const salarySave = el("button", { className: "btn btn-primary", type: "submit", textContent: TEXT.save });
    const salaryForm = el("form", { className: "admin-form", noValidate: true },
      field(TEXT.salaryLabel, salaryInput), salarySave);
    salaryForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const raw = salaryInput.value.trim();
      const amount = raw === "" ? null : Number(raw);
      if (amount !== null && !(amount >= 0)) return setMessage(line, TEXT.salaryInvalid, "error");
      adminAction(key, line, salarySave, async () => {
        const { data, error } = await db.from("mitarbeiter")
          .update({ monatsgehalt: amount })
          .eq("user_id", person.user_id)
          .select("user_id");
        if (error) return dataErrorText(error);
        return data.length === 1 ? null : TEXT.unexpected;
      }, TEXT.saved);
    });

    // Konto
    const newPin = pinInput();
    const pinSave = el("button", { className: "btn btn-primary", type: "submit", textContent: TEXT.changePin });
    const pinForm = el("form", { className: "admin-form", noValidate: true },
      field(TEXT.newPinLabel, newPin), pinSave);
    pinForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const pin = validateNewPin(newPin, line);
      if (!pin) return;
      adminAction(key, line, pinSave,
        () => callStaffFunction({ action: "pin", user_id: person.user_id, pin }),
        TEXT.pinChanged);
    });
    const toggle = el("button", {
      className: "btn btn-outline admin-tools", type: "button",
      textContent: person.aktiv ? TEXT.deactivate : TEXT.activate
    });
    toggle.addEventListener("click", () => adminAction(key, line, toggle,
      () => callStaffFunction({ action: "aktiv", user_id: person.user_id, aktiv: !person.aktiv }),
      person.aktiv ? TEXT.deactivated : TEXT.activated));

    return collapsible(key, [
      el("b", {}, el("bdi", { textContent: person.benutzername }),
        ...(person.aktiv ? [] : [el("span", { className: "badge", textContent: TEXT.inactive })])),
      el("span", { className: "amount", textContent: pay.due == null ? TEXT.noSalary : formatMoney(pay.due) })
    ],
      line,
      statsBlock(pay, person.monatsgehalt, value, true),
      missingEndNote(entries),
      el("h2", { textContent: TEXT.entries }),
      table,
      el("h2", { textContent: TEXT.logins }),
      el("p", { className: "hint", textContent: TEXT.loginsHint }),
      ...(logins.length
        ? [...logins].reverse().map(loginRow)
        : [el("p", { className: "empty", textContent: TEXT.noLogins })]),
      el("h2", { textContent: TEXT.notes }),
      ...(notes.length
        ? notes.map(noteView)
        : [el("p", { className: "empty", textContent: TEXT.noNotes })]),
      entryTitle,
      entryForm,
      el("h2", { textContent: TEXT.addAbsence }),
      absenceForm,
      el("h2", { textContent: TEXT.monthlySalary }),
      salaryForm,
      el("h2", { textContent: TEXT.changePin }),
      pinForm,
      toggle);
  }

  // ---------- Stempeln ----------
  async function stamp(action) {
    const seq = loadSeq;
    const message = $("stamp-msg");
    $("clock-in").disabled = $("clock-out").disabled = true;
    setMessage(message, "");

    let outcome;
    try {
      outcome = await action();
    } catch (error) {
      outcome = { text: dataErrorText(error), kind: "error" };
    }
    if (seq !== loadSeq) return;

    $("clock-in").disabled = $("clock-out").disabled = false;
    setMessage(message, outcome.text, outcome.kind);
    if (outcome.kind === "ok") {
      month = currentMonth();
      loadMonth();
    }
  }

  async function clockIn() {
    const { error } = await db.from("zeiten").insert({ user_id: currentUserId });
    if (!error) return { text: TEXT.clockedIn, kind: "ok" };
    if (error.code === "23505") return { text: TEXT.alreadyIn, kind: "error" };
    return { text: dataErrorText(error), kind: "error" };
  }

  async function clockOut() {
    // Der Wert ist nur ein Platzhalter: Der Datenbank-Trigger setzt immer die Serverzeit.
    const { data, error } = await db.from("zeiten")
      .update({ ende_zeit: "00:00:00" })
      .is("ende_zeit", null)
      .select("id");
    if (error) return { text: dataErrorText(error), kind: "error" };
    if (!data.length) return { text: TEXT.noOpenEntry, kind: "error" };
    return { text: TEXT.clockedOut, kind: "ok" };
  }

  // ---------- Sitzung ----------
  function wipeScreen() {
    loadSeq++;
    $("username").value = "";
    $("pin").value = "";
    setPinVisible(false);
    setMessage($("login-msg"), "", "error");
    setMessage($("stamp-msg"), "");
    $("greeting").replaceChildren();
    $("welcome-line").textContent = "";
    $("wisdom").textContent = "";
    noteDraft = null;
    $("content").replaceChildren();
    $("month-label").textContent = "";
    $("status").hidden = true;
    $("retry").hidden = true;
    $("stamp").hidden = true;
    $("app-view").classList.remove("wide");
    $("clock-in").disabled = $("clock-out").disabled = false;
    openCards.clear();
    notices.clear();
  }

  function applySession(session) {
    const userId = session?.user.id ?? null;
    if (userId === currentUserId) return;
    wipeScreen();
    currentUserId = userId;
    currentEmail = session?.user.email ?? null;
    $("login-view").hidden = Boolean(userId);
    $("app-view").hidden = !userId;
    if (!userId) return;
    const hour = Number(berlinNow({ hour: "2-digit", hourCycle: "h23" }));
    $("greeting").append(hour < 12 ? TEXT.morning : TEXT.evening, el("bdi", { textContent: session.user.email.split("@")[0] }));
    $("welcome-line").textContent = TEXT.welcomes[Math.floor(Math.random() * TEXT.welcomes.length)];
    $("wisdom").textContent = TEXT.wisdoms[dailyIndex(today(), TEXT.wisdoms.length)];
    month = currentMonth();
    loadMonth();
  }

  function logout() {
    applySession(null); // Bildschirm sofort leeren, noch vor der Serverantwort.
    loggingOut = db.auth.signOut()
      .catch(() => {})
      .then(() => {
        // Ohne Netz löscht signOut() die Sitzung nicht, deshalb hier immer entfernen.
        sessionStorage.clear();
        loggingOut = null;
      });
  }

  // ---------- Start ----------
  document.title = `${COMPANY_NAME} - تسجيل الدوام`;
  $("company-login").textContent = COMPANY_NAME;
  $("company-app").textContent = COMPANY_NAME;
  $("numpad").addEventListener("click", (event) => {
    const key = event.target.closest("button")?.dataset.key;
    if (!key) return;
    const pin = $("pin");
    pin.value = key === "del" ? pin.value.slice(0, -1) : normalizePin(pin.value + key);
  });
  $("pin").addEventListener("input", (event) => {
    event.target.value = normalizePin(event.target.value);
  });
  $("eye").addEventListener("click", () => setPinVisible($("pin").type === "password"));
  $("login-form").addEventListener("submit", handleLogin);
  $("clock-in").addEventListener("click", () => stamp(clockIn));
  $("clock-out").addEventListener("click", () => stamp(clockOut));
  $("prev-month").addEventListener("click", () => { month = shiftMonth(month, -1); loadMonth(); });
  $("next-month").addEventListener("click", () => { month = shiftMonth(month, 1); loadMonth(); });
  $("retry").addEventListener("click", loadMonth);
  $("logout").addEventListener("click", logout);

  if (!window.supabase) {
    setMessage($("login-msg"), TEXT.library, "error");
  } else if (!/^https?:\/\//.test(SUPABASE_URL)) {
    setMessage($("login-msg"), TEXT.config, "error");
  } else {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        // Sitzung übersteht ein Neuladen, endet aber mit dem Tab (gemeinsam genutzte Geräte).
        storage: window.sessionStorage,
        detectSessionInUrl: false
      }
    });
    db.auth.onAuthStateChange((_event, session) => {
      // setTimeout: Supabase warnt vor Deadlocks bei Abfragen direkt im Callback.
      setTimeout(() => { if (!loggingOut) applySession(session); }, 0);
    });
  }
})();
</script>
</body>
</html>
